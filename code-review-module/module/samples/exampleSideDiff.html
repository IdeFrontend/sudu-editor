<!DOCTYPE html>
<html>
<head>
  <title>Sudu SideDiff sample</title>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
  <style>
    html, body {
      height: 100%;
      background-color: #2b2b2b;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .diff {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    .left, .right {
      position: relative;
      width: 50%;
      height: 100%;
    }
  </style>
</head>
<body>
<div class="diff">
  <div class="left" id="left1"></div>
  <div class="right" id="right1"></div>
</div>
<div class="diff">
  <div class="left" id="left2"></div>
  <div class="right" id="right2"></div>
</div>

<script type="module" charset="utf-8" src="exampleSideDiff.js"></script>

</body>
</html>
